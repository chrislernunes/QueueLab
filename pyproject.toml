[project]
name = "queue_positioning-analysis"
version = "0.1.0"
description = "Figures and the research note for queue_positioning. The simulator is the OCaml package."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas==2.3.3",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "matplotlib==3.10.9",
  "seaborn==0.13.2",
]

[tool.queue_positioning]
note = "Pins match the environment used to draw reports/figures. The OCaml build does not import this file."
