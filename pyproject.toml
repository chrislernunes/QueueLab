[project]
name = "queuelab-analysis"
version = "0.1.0"
description = "Notebooks and figures for QueueLab. The simulator is the OCaml package."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas==2.3.3",
  "numpy==2.2.6",
  "scipy==1.15.3",
  "matplotlib==3.10.9",
  "seaborn==0.13.2",
  "nbformat==5.11.1",
  "nbclient==0.11.0",
  "ipykernel==7.3.0",
]

[tool.queuelab]
note = "Pins match the environment used to execute the committed notebooks. The OCaml build does not import this file."
